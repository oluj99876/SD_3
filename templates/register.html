{% extends 'base.html' %}

{% block title %}회원가입 - 캠퍼스 중고 전공서적 거래{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3">
        <h4 class="mb-0 fw-bold text-center">회원가입</h4>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('register') }}" id="registerForm">
          <div class="mb-3">
            <label for="student_id" class="form-label fw-semibold">학번 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="student_id" name="student_id"
                   placeholder="예: 2024001" pattern="[0-9]{7}" minlength="7" maxlength="7" inputmode="numeric" required autofocus>
            <div class="form-text">로그인 시 아이디로 사용됩니다. 잘못 입력할 경우 탈퇴 후 재가입해야 합니다.</div>
          </div>

          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">이름 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="name" name="name"
                   placeholder="이름을 입력하세요" minlength="1" maxlength="30" required>
          </div>

          <div class="mb-3">
            <label for="department" class="form-label fw-semibold">학과 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="department" name="department"
                   placeholder="예: 소프트웨어학과" minlength="1" maxlength="50" required>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label fw-semibold">전화번호</label>
            <input type="tel" class="form-control" id="phone" name="phone"
                   placeholder="예: 01012345678" pattern="010[0-9]{8}" minlength="11" maxlength="11" inputmode="numeric">
            <div class="form-text">거래 예약 승인 후 직거래 연락 시 참고용으로 활용됩니다.</div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">비밀번호 <span class="text-danger">*</span></label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="4~20자로 입력하세요" minlength="4" maxlength="20" required>
          </div>

          <div class="mb-4">
            <label for="password_confirm" class="form-label fw-semibold">비밀번호 확인 <span class="text-danger">*</span></label>
            <input type="password" class="form-control" id="password_confirm" name="password_confirm"
                   placeholder="비밀번호를 한 번 더 입력하세요" minlength="4" maxlength="20" required>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">가입하기</button>
          </div>
        </form>

        <hr class="my-4">
        <div class="text-center">
          <span class="text-muted small">이미 계정이 있으신가요?</span>
          <a href="{{ url_for('login') }}" class="small fw-semibold text-decoration-none ms-1">로그인</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('registerForm');
  const pw = document.getElementById('password');
  const pwConfirm = document.getElementById('password_confirm');

  form.addEventListener('submit', (e) => {
    if (pw.value !== pwConfirm.value) {
      e.preventDefault();
      alert('비밀번호와 비밀번호 확인이 일치하지 않습니다.');
      pwConfirm.focus();
    }
  });
});
</script>
{% endblock %}
